# The Camoufox build Argos installs by itself (docs/camoufox-distribution.md).
# Managed independently of the Argos version: changing it is a separate change that has to pass the same
# integrity and browser checks (.github/workflows/camoufox-distribution.yml).
release=156.0.1-beta.36
# Argos repackaging revision of that release (the two WebDriver BiDi fixes of daijro/camoufox#952 applied by
# aresstack/playwright4j docs/camoufox/hotpatch_omni.py, plus bundled add-ons).
revision=argos.1
# Public GitHub release of aresstack/argos that holds the archives; no authentication needed.
baseUrl=https://github.com/aresstack/argos/releases/download/camoufox-156.0.1-beta.36-argos.1/
# SHA-256 of camoufox-<release>-<revision>-<target>.zip, from the distribution workflow's SHA256SUMS.
sha256.win.x86_64=PENDING
sha256.lin.x86_64=PENDING
# SHA-256 of the omni.ja entries with the fixes in place (hotpatch_omni.py KNOWN_FILES, 156.0.1-beta.36).
fix.chrome/remote/content/shared/WindowManager.sys.mjs=047cca48c67255dc76523faa054487a641d1103e188c62ed2b06cd7756b0d46b
fix.chrome/remote/content/webdriver-bidi/modules/windowglobal/browsingContext.sys.mjs=4202f76e04e88059c1e6b9797228f4a04f9ed1d210984d5818f00ccc790df460
