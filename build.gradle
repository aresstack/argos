plugins {
    id 'java'
    id 'application'
    id 'org.springframework.boot' version '3.5.7'
}

group = 'com.aresstack'
version = providers.gradleProperty('releaseVersion').orElse('0.1.0-SNAPSHOT').get()

java {
    toolchain { languageVersion = JavaLanguageVersion.of(21) }
}

repositories {
    mavenLocal()
    mavenCentral()
}

// The Java Playwright API must use Playwright4J's GraalJS driver, never Node's driver.
configurations.configureEach {
    exclude group: 'com.microsoft.playwright', module: 'driver'
    exclude group: 'com.microsoft.playwright', module: 'driver-bundle'
}

dependencies {
    implementation 'com.aresstack:playwright4j:0.3.0'
    implementation('com.microsoft.playwright:playwright:1.62.0') {
        exclude group: 'com.microsoft.playwright', module: 'driver'
        exclude group: 'com.microsoft.playwright', module: 'driver-bundle'
    }
    implementation 'io.modelcontextprotocol.sdk:mcp:0.18.4'
    // Same central OAuth JWT verification library used by Pyloros.
    implementation 'com.aresstack:anauthentia-jwt:0.1.0'
    implementation 'org.eclipse.jetty:jetty-server:12.0.16'
    implementation 'org.eclipse.jetty.ee10:jetty-ee10-servlet:12.0.16'
    implementation 'org.slf4j:slf4j-simple:2.0.16'
    // Document text extraction (browser_document). Office Open XML / ODF use the JDK, not Apache POI.
    implementation 'org.apache.pdfbox:pdfbox:3.0.5'
    // Link extraction and search-page analysis from the serialized DOM on the Java side
    // (no page-visible scripts).
    implementation 'org.jsoup:jsoup:1.18.3'
    // Registrable domains (Public Suffix List) for the convenience profile's per-domain navigation limit.
    implementation 'com.google.guava:guava:33.4.0-jre'
    // Search History: classic full-text search per chat (as AskAI research-knowledge-lucene); no vectors.
    implementation 'org.apache.lucene:lucene-core:8.11.3'
    implementation 'org.apache.lucene:lucene-analyzers-common:8.11.3'
    testImplementation 'org.junit.jupiter:junit-jupiter:5.13.1'
    testImplementation 'org.mockito:mockito-core:5.15.2'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher:1.13.1'
}

application { mainClass = 'com.aresstack.argos.ArgosApplication' }

tasks.withType(JavaCompile).configureEach { options.encoding = 'UTF-8' }
tasks.named('test') {
    useJUnitPlatform()
    // -PtestCamoufox and -PtestCamoufox=true both opt in (a bare property arrives as an empty string).
    def camoufoxTests = providers.gradleProperty('testCamoufox').map { it.trim().isEmpty() || it.trim().toBoolean() }.orElse(false).get()
    systemProperty 'argos.testCamoufox', String.valueOf(camoufoxTests)
    // Drag diagnostics (DragDiagnosticsBrowserTest): prints event traces of several drag variants, needs -PtestCamoufox.
    systemProperty 'argos.dragDiagnostics', providers.gradleProperty('dragDiagnostics').orElse('false').get()
    // Raw-Playwright input tests (FieldSelection, KeyboardShortcut, HumanInput) need an executable path; with
    // -PtestCamoufox they take ARGOS_CAMOUFOX_EXECUTABLE unless -PtestHumanBrowser names another browser.
    systemProperty 'argos.testHumanBrowser', providers.gradleProperty('testHumanBrowser')
            .orElse(camoufoxTests ? (System.getenv('ARGOS_CAMOUFOX_EXECUTABLE') ?: '') : '').get()
    // Unicode input test: must Playwright4J type umlauts as trusted keys? Defaults to true when Playwright4J is built
    // from -Pplaywright4jSource (a fix under test), so a refusal fails the run instead of passing as fail-closed.
    systemProperty 'argos.expectUnicodeKeys', providers.gradleProperty('expectUnicodeKeys')
            .orElse(providers.gradleProperty('playwright4jSource').map { 'true' }).orElse('false').get()
    // Optional: engine-independent background-tab and batch tests against a local Chromium binary
    // (e.g. -PtestChromium=/path/to/chrome) where no Camoufox is installed. Production uses Camoufox only.
    systemProperty 'argos.testChromium', providers.gradleProperty('testChromium').orElse('').get()
    // Test-only environment. Production must receive SERVER_PORT from the managed service.
    environment 'SERVER_PORT', '18098'
    environment 'SECURITY_MODE', 'none'
}
// The managed webserver starts one executable JAR, never an external lib/ tree.
// Spring Boot's nested-JAR launcher preserves GraalJS and Playwright4J JAR
// boundaries, including META-INF/services and multi-release class files.
tasks.named('bootJar') {
    archiveFileName = 'argos.jar'
    mainClass = application.mainClass.get()
    layered { enabled = false }
}

tasks.named('jar') {
    enabled = false
}

// Compatibility with the existing AresStack managed JAR path.
// A packaged Argos JAR is invalid if the embedded Playwright4J driver JVM
// cannot start. Fail the build immediately, not after the webserver restarts it.
tasks.register('verifyStandaloneRuntime', Exec) {
    group = 'verification'
    description = 'Verify the Playwright4J driver subprocess from the standalone JAR'
    dependsOn tasks.named('bootJar')
    def java21 = javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(21)
    }
    executable = java21.get().executablePath.asFile.absolutePath
    args '-jar', tasks.named('bootJar').get().archiveFile.get().asFile.absolutePath, '--verify-runtime'
}

tasks.register('packageArgos', Sync) {
    dependsOn tasks.named('bootJar')
    dependsOn tasks.named('verifyStandaloneRuntime')
    into layout.buildDirectory.dir('package')
    from(tasks.named('bootJar'))
}

tasks.register('argosZip', Zip) {
    dependsOn tasks.named('packageArgos')
    archiveFileName = 'argos-package.zip'
    destinationDirectory = layout.buildDirectory.dir('distributions')
    from(layout.buildDirectory.dir('package'))
}

// Model evaluation (docs/model-evaluation.md): drives Argos over MCP with a real language model from an
// OpenAI-compatible or Ollama endpoint against a local fixture world. Never part of argos.jar.
sourceSets {
    eval {
        compileClasspath += sourceSets.main.output + configurations.runtimeClasspath
        runtimeClasspath += output + compileClasspath
    }
    test {
        compileClasspath += sourceSets.eval.output
        runtimeClasspath += sourceSets.eval.output
    }
}

tasks.register('evalModels', JavaExec) {
    group = 'verification'
    description = 'Run the Argos task set with a language model (see docs/model-evaluation.md)'
    classpath = sourceSets.eval.runtimeClasspath
    mainClass = 'com.aresstack.argos.eval.EvalMain'
    // -Peval.model=qwen3:8b -Peval.profile=compact ... become -Dargos.eval.model=... (environment ARGOS_EVAL_* also works).
    providers.gradlePropertiesPrefixedBy('eval.').get().each { key, value ->
        systemProperty "argos.${key}", value
    }
    workingDir = projectDir
    // Quiet console: per-task lines only. The MCP client warns about Argos' intentional 405 on GET (no SSE stream).
    systemProperty 'org.slf4j.simpleLogger.log.io.modelcontextprotocol', 'error'
    systemProperty 'org.slf4j.simpleLogger.log.org.eclipse.jetty', 'warn'
    // The harness starts Argos in-process with its own port, profile and security mode; these only satisfy
    // ArgosConfig.fromEnvironment(), which supplies the Camoufox paths and readiness settings.
    environment 'SERVER_PORT', '18099'
    environment 'SECURITY_MODE', 'none'
}
