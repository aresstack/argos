rootProject.name = 'argos'

// -Pplaywright4jSource=<path to a playwright4j checkout>: substitute the resolved
// com.aresstack:playwright4j:0.3.0 dependency with that source checkout for focused integration testing.
def playwright4jSource = startParameter.projectProperties['playwright4jSource']
if (playwright4jSource) {
    includeBuild(playwright4jSource)
}
