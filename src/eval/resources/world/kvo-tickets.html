<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Ticket status – Kestrel Valley Observatory</title></head>
<body>
<nav><a href="/kvo/">Home</a></nav>
<h1>Check your ticket</h1>
<p>Enter your ticket number (for example KV-1000) and press "Check status".</p>
<form action="/kvo/tickets/status" method="get">
  <label for="ticket">Ticket number</label>
  <input id="ticket" name="ticket" type="text" placeholder="KV-0000">
  <button type="submit">Check status</button>
</form>
</body></html>
